name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &paths
      - .github/workflows/ci.yaml
      - cmd/**
      - internal/**
      - docker-bake.hcl
      - Dockerfile
      - go.mod
      - go.sum
      - main.go
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths

permissions:
  packages: write

env:
  TAG: edge
  BUILD_HASH: ${{ github.sha }}
  BUILD_ID: r${{ github.run_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Unit test & build
        uses: docker/bake-action@v7
        with:
          source: .
          targets: test,build
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

  integration:
    runs-on: ubuntu-latest
    # Run inside a root container so the test can create real accounts. This is
    # the SAME `go test -tags integration` that scripts/verify-integration.sh
    # runs locally via the dind sidecar.
    container:
      image: golang:1.26
    env:
      DEBIAN_FRONTEND: noninteractive
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v6

      - name: Install shadow-utils + samba
        run: |
          apt-get update -qq
          apt-get install -y -qq passwd samba samba-common-bin smbclient

      - name: Integration test (real useradd + samba, throwaway container)
        run: go test -tags integration -v ./internal/integration/

  # Only push the image when BOTH the unit-test/build and the integration test
  # pass — a failing integration run must not publish an image.
  push:
    needs: [build, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Regenerate ./dist (cached from the build job), then assemble + push the
      # multi-arch app image whose context is ./dist. Two steps so `app` runs
      # after `build` (bake has no dependency between them).
      - name: Build dist
        uses: docker/bake-action@v7
        with:
          source: .
          targets: build
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha

      - name: Push
        uses: docker/bake-action@v7
        with:
          source: .
          targets: app
          set: |
            app.platform=linux/amd64
            app.platform=linux/arm64
            app.output=type=registry
