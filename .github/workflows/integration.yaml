name: integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &paths
      - .github/workflows/integration.yaml
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - main.go
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths

jobs:
  integration:
    runs-on: ubuntu-latest
    # Run every step inside a container as root so the test can create real
    # accounts. This is the same `go test -tags integration` that
    # scripts/verify-integration.sh runs locally via the dind sidecar.
    container:
      image: golang:1.26
    env:
      DEBIAN_FRONTEND: noninteractive
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v6

      - name: Install shadow-utils + samba
        run: |
          apt-get update -qq
          apt-get install -y -qq passwd samba samba-common-bin

      - name: Integration test (real useradd + samba, throwaway container)
        run: go test -tags integration -v ./internal/integration/
