services:
  app:
    image: ghcr.io/lesomnus/usersync:${REVISION:-local}
    command: [version]

    network_mode: host
    privileged: true

    volumes:
      - ./usersync.yaml:/usersync.yaml:ro

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 64M
        reservations:
          cpus: "2"
          memory: 32M
